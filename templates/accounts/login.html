{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Вход | CampusMarket{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right text-primary display-4"></i>
                        <h2 class="fw-bold mt-2">Вход в аккаунт</h2>
                        <p class="text-muted">Войдите в свой университетский аккаунт</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">
                            Войти
                        </button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <p class="mb-0 text-muted">Ещё нет аккаунта? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-semibold">Зарегистрироваться</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
