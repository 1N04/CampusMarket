{% extends 'base.html' %}

{% block title %}Пароль изменён | CampusMarket{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm border-0 rounded-4 p-5 mx-auto" style="max-width: 500px;">
        <i class="bi bi-check-circle-fill text-success display-3 mb-3"></i>
        <h3 class="fw-bold">Пароль успешно обновлен!</h3>
        <p class="text-muted">Ваш новый пароль сохранен. Вы можете продолжать работу с платформой.</p>
        <div class="mt-3">
            <a href="{% url 'accounts:profile' %}" class="btn btn-primary fw-semibold px-4">Вернуться в профиль</a>
        </div>
    </div>
</div>
{% endblock %}
