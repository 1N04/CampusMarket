{% extends 'base.html' %}

{% block title %}Удаление товара | CampusMarket{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <i class="bi bi-exclamation-triangle text-danger display-4 mb-3"></i>
                <h3 class="fw-bold mb-2">Удалить объявление?</h3>
                <p class="text-muted mb-4">
                    Вы уверены, что хотите удалить объявление <strong>«{{ item.title }}»</strong>? Это действие нельзя будет отменить.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{{ item.get_absolute_url }}" class="btn btn-outline-secondary px-4">Отмена</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
